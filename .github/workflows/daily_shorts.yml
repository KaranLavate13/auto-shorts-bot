    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # --- ADD THIS NEW BLOCK ---
    - name: Install System Dependencies (ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick ghostscript
        # Ubuntu's default ImageMagick security policy blocks text rendering. This removes that restriction:
        sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml
    # --------------------------

    - name: Install Dependencies
      run: pip install -r requirements.txt
      
